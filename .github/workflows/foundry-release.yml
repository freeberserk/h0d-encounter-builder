name: Build and publish Foundry module
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests H0D Encounter Builder
        run: |
          npm test
          npm run check
          node --check scripts/h0d-launcher-macro.js
          node tests/launcher-macro.test.mjs
          python3 -m json.tool module.json > /dev/null
          python3 - <<'PY'
          import json,glob
          for p in glob.glob('data/*.json'):
              json.load(open(p,encoding='utf-8'))
          PY
      - name: Package and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existe déjà"; exit 0
          fi
          zip -q -r h0d-encounter-builder.zip module.json scripts styles data README.md CHANGELOG.md
          gh release create "$TAG" h0d-encounter-builder.zip module.json --target "$GITHUB_SHA" --title "H0D Encounter Builder $TAG" --notes-file CHANGELOG.md
